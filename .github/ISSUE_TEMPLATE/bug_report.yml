name: Bug report
description: Something is not working (setup, connection, entities, control)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste your `app_key.pem` or certificate** — redact secrets.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About → Version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: From HACS or the manifest version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: Home Assistant install type
      options:
        - Home Assistant OS
        - Home Assistant Supervised
        - Home Assistant Container (Docker)
        - Home Assistant Core (venv)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it fail?
      options:
        - Adding the integration (config flow / "Cannot connect")
        - Integration loads but no entities
        - Entities appear but are unavailable
        - Reading works but control (setpoint/mode) fails
        - Credential export (emulator / adb)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Settings → System → Logs, filter `danfoss_link`. Redact secrets.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The Danfoss Link app (phone/emulator) is force-stopped — only one client per certificate.
          required: true
        - label: I have not pasted my private key or full certificates above.
          required: true
